apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespece: roboshop
  labels:
    project: roboshop
    component: redis
    tier: db
spec:
  clusterIp: none
  selector: 
    project: roboshop
    component: redis
    tier: db
  ports:  
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespece: roboshop
  labels:
    project: roboshop
    component: redis
    tier: db
spec:
  selector: 
    project: roboshop
    component: redis
    tier: db
  ports:  
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Statefulset
metadata:
  name: redis
  namespace: roboshop
  labels: 
    project: roboshop
    component: redis
    tier: db
spec:
  serviceName: redis-headless
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: redis
      tier: db
  template:
    metadata:
      name: redis
      labels:
        project: roboshop
        component: redis
        tier: db
    spec:
      containers:
        - name: redis
          image: pavithrakasukurthi/redis:v1
          volumeMounts:
            - name: redis
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: roboshop-ebs 
        resources:
          requests:
            storage: 1Gi
