apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespece: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: db
spec:
  clusterIp: none
  selector: 
    project: roboshop
    component: rabbitmq
    tier: db
  ports:  
    - protocol: TCP
      port: 5672
      targetPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespece: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: db
spec:
  selector: 
    project: roboshop
    component: rabbitmq
    tier: db
  ports:  
    - protocol: TCP
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: roboshop
  labels: 
    project: roboshop
    component: rabbitmq
    tier: db
spec:
  serviceName: rabbitmq-headless
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      component: rabbitmq
      tier: db
  template:
    metadata:
      name: rabbitmq
      labels:
        project: roboshop
        component: rabbitmq
        tier: db
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: roboshop
            - name: RABBITMQ_DEFAULT_PASS
              value: roboshop123
          volumeMounts:
            - name: rabbitmq
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: roboshop-ebs 
        resources:
          requests:
            storage: 1Gi
