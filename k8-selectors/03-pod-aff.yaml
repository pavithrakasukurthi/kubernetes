apiVersion: v1
kind: Pod 
metadata:
  name: pod-aff
  labels:
    project: roboshop
    purpose: demo
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
       - labelSelector:
           matchExpressions:
              - key: project
                operator: In 
                values:  
                  - roboshop
         topologyKey: topology.kubernetes.io/hostname

  containers:
    - name: nginx
      image: nginx
      imagePullPolicy: Always
          
