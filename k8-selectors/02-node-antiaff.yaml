apiVersion: v1
kind: Pod 
metadata:
  name: node-anti 
  labels:
    project: roboshop
    purpose: demo
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoreDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: NotIn
                values: us-east-1b
                  - 
  containers:
    - name: nginx
      image: nginx
      imagePullPolicy: Always
          
