apiVersion: v1
kind: Pod 
metadata:
  name: nod-aff
  labels:
    project: roboshop
    purpose: demo
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
             - key: topology.kubernetes.io/zone
               operator: In 
               values: 
                - us-east-1b
      preferredDuringSchedulingIgnoredDuringExecution:
       - weight: 20
         preference:
          matchExpressions:
            - key: important
              operator: In 
              values: 
                - yeah
       - weight: 10
         preference:
          matchExpressions:
            - key: important
              operator: In
              value:
                - no 
  containers:
    - name: nginx
      image: nginx
      imagePullPolicy: Always