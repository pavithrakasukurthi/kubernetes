apiVersion: v1
kind: Service
metadata:
  name: ss-demo
spec:
  selector:
    project: roboshop
    purpose: practice
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: ss-headless
spec:
  clusterIp: none
  selector:
    project: roboshop
    purpose: practice
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Statefulset
metadata:
  name: nginx
spec:
  serviceName: ss-headless
  replicas: 3
  selector:
    matchLabels:
      project: roboshop
      purpose: practice
  template:
    metadata:
      labels:
        project: roboshop
        purpose: practice
    spec:
      containers:
        - name: nginx
          image: nginx
          volumeMounts:
            - name: nginx-html
              mountPath: /usr/share/nginx/html
  volumeClaimtemplates:
    - metadata:
        name: nginx-html
      spec:
        accessModes: 
          - ReadWriteOnce
        storageClassName: roboshop-ebs
        resources:
          requests: 
            storage: 1Gi 
      