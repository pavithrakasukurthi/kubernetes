apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: frontend
  labels:
    project: roboshop
    environment: stage
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      environment: stage
      component: frontend
  template:
    metadata: 
      name: replicaset-demo
      labels:
        project: roboshop
        environment: stage
        component: frontend
    spec:
      containers:
        - name: nginx
          image: nginx

