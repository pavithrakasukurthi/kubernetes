apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  labels:
    project: roboshop
    purpose: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop
      purpose: demo
  template:
    metadata:
      labels:
        project: roboshop
        purpose: demo
    spec:
      containers:
        - name: app1
          image: pavithrakasukurthi/app1:v1
---
apiVersion: v1
kind: Service
metadata:
  name: app1
spec:
  selector:
    project: roboshop
    purpose: demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: 
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/tags: project=roboshop, purpose=demo 
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules:
    - host: app1.pavithra.sbs
      http:
        paths:
          - path: /
            pathType: Prefix 
            backend:
              service: 
                name: app1
                port:
                  number: 80

