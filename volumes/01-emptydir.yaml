apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels:
    project: roboshop
    purpose: demo
spec:
  containers:
    - name: nginx
      image: nginx
      volumeMounts:
        - name: nginx-logs
          mountPath: /var/log/nginx
    - name: almalinux
      image: almalinux:9
      volumeMounts:
        - name: nginx-logs
          mountPath: /mnt/nginx-log
  volumes:
    - name: nginx-logs
      emptyDir:
        sizeLimit: 100Mi
