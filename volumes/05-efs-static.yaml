apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  storageClassName: ""
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-052cca4e98a4cb71c
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: efs-static
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: efs-static
  labels:
    project: roboshop
    purpose: practice
spec:
  containers:
    - name: nginx
      image:  nginx
      volumeMounts:
        - name: nginx-html
          mountPath: /usr/share/nginx/html
  nodeSelector:
  volumes:
    - name: nginx-html
      persistentVolumeClaim:
        claimName: efs-static
---
apiVersion: v1
kind: Service
metadata:
  name: efs-static
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    purpose: practice
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30003
  